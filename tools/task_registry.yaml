# task_registry.yaml — the ONLY place new functionality is added.
# core-lite-intake.yml reads this and runs each task. Adding a feature means
# adding an entry here, never adding a workflow file.

version: "0.1"

tasks:
  - id: closure-harness
    kind: validator
    entry: tools/closure-harness/run_closure_harness.py
    runtime: python3
    deps: [pyyaml]
    fail_on_nonzero_exit: true
    description: >
      Decides STCM conservation-record closure as a computed predicate across
      nine layers: each Prime Node (PN-001..006) in isolation, the composed
      pipeline, the routing front-gate (§14-16), the routed-hop integration
      (§15-16), multi-node coherent-recognition merge (§19) with a full §20
      node_activation block, sequential receipt lineage (v0.4), the governed
      append-only receipt store with conflict-resolution policy (v0.5:
      store->lineage->conflict->closure->update, history-preserving), the
      portable receipt authority predicate surface (v0.6), and the
      closure-predicate regression. Reports a coverage matrix per layer.
      Terminates on saturation, not on a watched checkmark. Exit 0 = saturated;
      exit 1 = unexpected verdict.

  - id: stcm-v0-6-portability-predicate
    kind: validator
    entry: tools/closure-harness/portability_predicate_check.py
    runtime: python3
    deps: []
    fail_on_nonzero_exit: true
    description: >
      Saturates the STCM v0.6 portable receipt authority predicate surface by
      deriving all fixture rows from portability_fixtures.py, evaluating each
      row through portability.evaluate_portability(), and emitting both the
      detailed predicate report and compact saturation record. This is a
      registered task under core-lite-intake, not a separate workflow.

  - id: stcm-v0-6-artifact-capture-check
    kind: validator
    entry: tools/closure-harness/artifact_capture_check_v2.py
    runtime: python3
    deps: []
    fail_on_nonzero_exit: true
    description: >
      Validates the generated STCM v0.6 portability saturation report inside
      the governed core-lite-intake workspace and emits a compact artifact
      capture status report. This confirms the saturation fields before the
      validation record may be promoted.

  - id: stcm-v0-7-adoption-handshake
    kind: validator
    entry: tools/closure-harness/adoption_predicate_check.py
    runtime: python3
    deps: []
    fail_on_nonzero_exit: true
    description: >
      Saturates the STCM v0.7 receiving-repo adoption handshake predicate for
      portable receipts. This is a registered task under core-lite-intake, not a
      separate workflow.

  - id: stcm-v0-7-receiver-decision-receipt
    kind: validator
    entry: tools/closure-harness/receiver_decision_receipt_check.py
    runtime: python3
    deps: []
    fail_on_nonzero_exit: true
    description: >
      Validates the STCM v0.7 receiver decision receipt schema and confirms
      that receipt outcome and adopted state agree with the adoption handshake.
      This is a registered task under core-lite-intake, not a separate workflow.

  - id: stcm-v0-8-receipt-chain
    kind: validator
    entry: tools/closure-harness/receipt_chain_check.py
    runtime: python3
    deps: []
    fail_on_nonzero_exit: true
    description: >
      Validates the STCM v0.8 receipt-chain link surface without claiming final
      cross-repo validity.
