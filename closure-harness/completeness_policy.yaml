policy_id: stcm-closure-completeness-v2
policy_version: 2.0.0
status: policy_active
stages:
  low:
    required_fields:
      - transition_id
      - stage
      - expected
      - basis
    terminal_states:
      - SATISFIED
      - PROVEN_UNSATISFIABLE
    merge_policy:
      minimum_nodes: 1
      require_distinct_receipt_ids: true
      require_merge_proof_when_nodes_exceed: 1
  medium:
    required_fields:
      - transition_id
      - stage
      - expected
      - basis
      - authority_current
    terminal_states:
      - SATISFIED
      - PROVEN_UNSATISFIABLE
    merge_policy:
      minimum_nodes: 1
      require_distinct_receipt_ids: true
      require_merge_proof_when_nodes_exceed: 1
  high:
    required_fields:
      - transition_id
      - stage
      - expected
      - basis
      - authority_current
      - consent_resolved
      - commit_time_reconstruction
    terminal_states:
      - SATISFIED
      - PROVEN_UNSATISFIABLE
    merge_policy:
      minimum_nodes: 2
      require_distinct_receipt_ids: true
      require_merge_proof_when_nodes_exceed: 1
non_claims:
